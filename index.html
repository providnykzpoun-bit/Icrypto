<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Царь — Колесо Фортуны</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #3d000c 0%, #1a0005 100%);
            color: #ffd700;
            font-family: 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        header {
            margin-top: 15px;
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 25px;
            border-radius: 15px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 5px;
            font-size: 18px;
        }
        .stat-item span {
            color: #fff;
            font-weight: bold;
        }

        .center-stage {
            position: absolute;
            top: 36%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }
        .crown {
            font-size: 70px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
            animation: pulseCrown 2s infinite ease-in-out;
        }
        @keyframes pulseCrown {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .wheel-box {
            margin-top: 10px;
            width: 140px;
            height: 140px;
            border: 4px solid #ffd700;
            border-radius: 50%;
            background: conic-gradient(#8B4513 0deg 120deg, #b8860b 120deg 240deg, #5c2d0c 240deg 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            transition: transform 1.5s cubic-bezier(0.15, 0.9, 0.2, 1);
            position: relative;
        }
        .wheel-center {
            width: 50px;
            height: 50px;
            background: #ffd700;
            border-radius: 50%;
            border: 3px solid #3d000c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .barrels-container {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .barrel {
            width: 75px;
            height: 95px;
            background: linear-gradient(135deg, #8B4513 0%, #5c2d0c 100%);
            border: 3px solid #ffd700;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.7);
            position: relative;
            transition: all 0.3s;
        }
        .barrel.selected {
            transform: scale(1.15);
            border-color: #fff;
            box-shadow: 0 0 25px #ffd700;
        }
        .barrel-rings {
            position: absolute;
            width: 100%;
            height: 7px;
            background: #b8860b;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }
        .ring-top { top: 15px; }
        .ring-bottom { bottom: 15px; }
        .barrel-content {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 2px #000;
            z-index: 3;
        }

        .spin-btn-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .modal h2 {
            font-size: 36px;
            color: #ffd700;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .modal p {
            font-size: 18px;
            max-width: 400px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #ffd700 0%, #daa520 100%);
            color: #3d000c;
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            transition: transform 0.2s, background 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ffe44d 0%, #ffcc00 100%);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>Царство</h1>
        <div class="stats">
            <div class="stat-item">Цари: <span id="score">0</span></div>
            <div class="stat-item">Бриллианты: <span id="diamonds">0</span>/10</div>
        </div>
    </header>

    <div class="center-stage">
        <div class="crown">👑</div>
        <div class="wheel-box" id="wheel">
            <div class="wheel-center">🎯</div>
        </div>
    </div>

    <div class="barrels-container" id="barrels-container"></div>

    <div class="spin-btn-container">
        <button class="btn" id="spin-btn" onclick="spinWheel()">Крутить Колесо</button>
    </div>

    <div id="start-modal" class="modal">
        <h2>👑 Добро пожаловать, Царь!</h2>
        <p>Вращайте Колесо Фортуны, чтобы выбрать царский бочонок!<br>💎 <b>Бриллиант</b> = +10 Царей<br>❌ <b>Пусто</b> = -5 Царей<br><br>Соберите 10 бриллиантов для победы!</p>
        <button class="btn" onclick="startGame()">Начать правление</button>
    </div>

    <div id="win-modal" class="modal hidden">
        <h2>🎉 Триумф! 🎉</h2>
        <p>Вы собрали все 10 бриллиантов и доказали свою мудрость! Казна полна великих Царей.</p>
        <button class="btn" onclick="resetGame()">Новое царствование</button>
    </div>

    <script>
        let score = 0;
        let diamondsFound = 0;
        let gameActive = false;
        let currentRotation = 0;
        let winningBarrelIndex = 0;
        let barrelsData = [];
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let now = audioCtx.currentTime;
                if (type === 'spin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 1.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                    osc.start(now);
                    osc.stop(now + 1.2);
                } else if (type === 'diamond') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'empty') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'win') {
                    let notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, index) => {
                        let o = audioCtx.createOscillator();
                        let g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + index * 0.15);
                        g.gain.setValueAtTime(0.3, now + index * 0.15);
                        g.exponentialRampToValueAtTime(0.001, now + index * 0.15 + 0.4);
                        o.start(now + index * 0.15);
                        o.stop(now + index * 0.15 + 0.4);
                    });
                }
            } catch (e) {
                console.log(e);
            }
        }

        function startGame() {
            initAudio();
            document.getElementById('start-modal').classList.add('hidden');
            score = 0;
            diamondsFound = 0;
            updateStats();
            gameActive = true;
            setupNewRound();
        }

        function resetGame() {
            document.getElementById('win-modal').classList.add('hidden');
            startGame();
        }

        function updateStats() {
            document.getElementById('score').innerText = score;
            document.getElementById('diamonds').innerText = diamondsFound;
        }

        function setupNewRound() {
            const container = document.getElementById('barrels-container');
            container.innerHTML = '';
            
            winningBarrelIndex = Math.floor(Math.random() * 3);
            barrelsData = [0, 1, 2].map(i => (i === winningBarrelIndex));

            for (let i = 0; i < 3; i++) {
                const barrel = document.createElement('div');
                barrel.className = 'barrel';
                barrel.id = 'barrel-' + i;
                barrel.innerHTML = `
                    <div class="barrel-rings ring-top"></div>
                    <div class="barrel-content">?</div>
                    <div class="barrel-rings ring-bottom"></div>
                `;
                container.appendChild(barrel);
            }

            document.getElementById('spin-btn').disabled = false;
        }

        function spinWheel() {
            if (!gameActive) return;
            document.getElementById('spin-btn').disabled = true;
            playSound('spin');

            const targetBarrel = Math.floor(Math.random() * 3);
            const sectorAngle = 120;
            const extraSpins = 4 * 360;
            const targetAngle = extraSpins + (targetBarrel * sectorAngle) + 60;
            
            currentRotation += targetAngle;
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                revealBarrel(targetBarrel);
            }, 1500);
        }

        function revealBarrel(selectedIdx) {
            const barrelEl = document.getElementById('barrel-' + selectedIdx);
            if (!barrelEl) return;
            barrelEl.classList.add('selected');

            const contentDiv = barrelEl.querySelector('.barrel-content');
            const hasDiamond = barrelsData[selectedIdx];

            setTimeout(() => {
                if (hasDiamond) {
                    contentDiv.innerHTML = '💎';
                    barrelEl.style.background = 'linear-gradient(135deg, #005c8a 0%, #002b3d 100%)';
                    score += 10;
                    diamondsFound++;
                    playSound('diamond');
                    updateStats();

                    if (diamondsFound >= 10) {
                        triggerWin();
                        return;
                    }
                } else {
                    contentDiv.innerHTML = '❌';
                    barrelEl.style.background = 'linear-gradient(135deg, #8a0000 0%, #3d0000 100%)';
                    score -= 5;
                    playSound('empty');
                    updateStats();
                }

                setTimeout(() => {
                    if (gameActive) {
                        setupNewRound();
                    }
                }, 1500);

            }, 400);
        }

        function triggerWin() {
            gameActive = false;
            playSound('win');
            document.getElementById('win-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
