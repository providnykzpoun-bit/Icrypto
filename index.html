<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Царь — Колесо Фортуны</title>
    <!-- Підключаємо Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Підключаємо офіційний TonConnect UI SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #3d000c 0%, #1a0005 100%);
            color: #ffd700;
            font-family: 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        header {
            margin-top: 6px;
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 12px;
            border-radius: 12px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 96%;
            max-width: 400px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }
        h1 {
            margin: 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px #000;
        }
        .stats {
            display: flex;
            gap: 8px;
            font-size: 11px;
        }
        .stat-item span {
            color: #fff;
            font-weight: bold;
        }
        .header-bottom {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 4px;
        }

        .center-stage {
            position: absolute;
            top: 36%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }
        .crown {
            font-size: 38px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
            animation: pulseCrown 2s infinite ease-in-out;
        }
        @keyframes pulseCrown {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .wheel-box {
            margin-top: 4px;
            width: 85px;
            height: 85px;
            border: 4px solid #ffd700;
            border-radius: 50%;
            background: conic-gradient(#8B4513 0deg 72deg, #b8860b 72deg 144deg, #5c2d0c 144deg 216deg, #8B4513 216deg 288deg, #b8860b 288deg 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            transition: transform 1.5s cubic-bezier(0.15, 0.9, 0.2, 1);
            position: relative;
        }
        .wheel-center {
            width: 26px;
            height: 26px;
            background: #ffd700;
            border-radius: 50%;
            border: 2px solid #3d000c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .barrels-container {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .barrel {
            width: 48px;
            height: 66px;
            background: linear-gradient(135deg, #8B4513 0%, #5c2d0c 100%);
            border: 2px solid #ffd700;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            position: relative;
            transition: all 0.3s;
        }
        .barrel.selected {
            transform: scale(1.1);
            border-color: #fff;
            box-shadow: 0 0 20px #ffd700;
        }
        .barrel-rings {
            position: absolute;
            width: 100%;
            height: 3px;
            background: #b8860b;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }
        .ring-top { top: 7px; }
        .ring-bottom { bottom: 7px; }
        .barrel-content {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 2px #000;
            z-index: 3;
        }

        .spin-btn-container {
            position: absolute;
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            text-align: center;
            width: 90%;
        }
        .spin-cost {
            font-size: 10px;
            color: #ffcccc;
            margin-top: 2px;
            text-shadow: 1px 1px 2px #000;
        }

        /* Нижня фіксована панель для кнопок Обмін та Гаманець */
        .bottom-action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 5, 8, 0.95);
            padding: 8px 12px;
            display: flex;
            gap: 10px;
            z-index: 20;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.8);
        }
        .bottom-action-bar button {
            flex: 1;
            padding: 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            border: 1px solid #ffd700;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-exchange-main {
            background: linear-gradient(135deg, #00cc66 0%, #008844 100%);
            color: #fff;
            border-color: #00ffcc;
        }
        .btn-wallet-main {
            background: linear-gradient(135deg, #0098EA 0%, #0066AA 100%);
            color: #fff;
            border-color: #4da6ff;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .modal h2 {
            font-size: 20px;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .modal p {
            font-size: 12px;
            max-width: 360px;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .btn {
            background: linear-gradient(135deg, #ffd700 0%, #daa520 100%);
            color: #3d000c;
            border: none;
            padding: 9px 18px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            transition: transform 0.2s, background 0.2s;
            margin: 4px;
        }
        .btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ffe44d 0%, #ffcc00 100%);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .hidden {
            display: none !important;
        }
        #wallet-status-text {
            font-size: 10px;
            color: #ff4d4d;
            font-weight: bold;
        }
        #wallet-status-text.connected {
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>Царство</h1>
            <div class="stats">
                <div class="stat-item">Баллы: <span id="points">100</span></div>
                <div class="stat-item">Цари: <span id="score">0</span></div>
                <div class="stat-item">Алмазы: <span id="diamonds">0</span>/10</div>
            </div>
        </div>
        <div class="header-bottom">
            <span>Статус:</span>
            <span id="wallet-status-text">Не подключен</span>
        </div>
    </header>

    <div class="center-stage">
        <div class="crown">👑</div>
        <div class="wheel-box" id="wheel">
            <div class="wheel-center">🎯</div>
        </div>
    </div>

    <div class="barrels-container" id="barrels-container"></div>

    <div class="spin-btn-container">
        <button class="btn" id="spin-btn" onclick="spinWheel()">Крутить Колесо (10 баллов)</button>
        <div class="spin-cost">5 бочонков • 50% шанс на Царей</div>
    </div>

    <!-- Нова фіксована нижня панель з кнопками Обмін та Кошелек -->
    <div class="bottom-action-bar">
        <button class="btn-exchange-main" onclick="exchangePointsToTsars()">🔄 Обміняти</button>
        <button class="btn-wallet-main" onclick="openWalletModal()">💳 Кошелек</button>
    </div>

    <div id="win-modal" class="modal hidden">
        <h2>🎉 Триумф! 🎉</h2>
        <p>Вы собрали все 10 алмазов и доказали свою мудрость!</p>
        <button class="btn" onclick="resetGame()">Новое царствование</button>
    </div>

    <div id="gameover-modal" class="modal hidden">
        <h2>⚠️ Баллы закончились! ⚠️</h2>
        <p>У вас не осталось баллов для прокрутов. Вы можете приобрести 50 баллов за 0.001 TON!</p>
        <button class="btn" onclick="buyPointsWithTon()">Купить 50 баллов (0.001 TON)</button>
        <br>
        <button class="btn" style="background: #666; color: #fff; font-size: 11px; padding: 6px 12px;" onclick="resetGame()">Начать с нуля</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let points = 100;
        let score = 0;
        let diamondsFound = 0;
        let gameActive = true;
        let currentRotation = 0;
        let winningBarrelIndex = 0;
        let barrelsData = [];
        let audioCtx = null;

        const SPIN_COST_POINTS = 10;
        const WIN_REWARD_POINTS = 20;
        const TOTAL_BARRELS = 5;

        // Ваш реальный адрес кошелька:
        const MY_WALLET_ADDRESS = "UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw";

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://providnykzpoun-bit.github.io/Wallet/tonconnect-manifest.json'
        });

        tonConnectUI.onStatusChange(wallet => {
            const statusText = document.getElementById('wallet-status-text');
            if (wallet) {
                const address = wallet.account.address;
                const shortAddr = address.slice(0, 4) + '...' + address.slice(-4);
                statusText.innerText = shortAddr;
                statusText.classList.add('connected');
            } else {
                statusText.innerText = 'Не подключен';
                statusText.classList.remove('connected');
            }
        });

        async function openWalletModal() {
            initAudio();
            try {
                if (tonConnectUI.connected) {
                    await tonConnectUI.disconnect();
                } else {
                    await tonConnectUI.openModal();
                }
            } catch (error) {
                console.error("TonConnect error:", error);
            }
        }

        async function exchangePointsToTsars() {
            initAudio();
            if (points < 50) {
                alert("Требуется не менее 50 баллов для обмена!");
                return;
            }

            if (!tonConnectUI.connected) {
                alert("Пожалуйста, подключите кошелек для осуществления обмена!");
                await tonConnectUI.openModal();
                return;
            }

            try {
                const userId = tg.initDataUnsafe?.user?.id || "unknown";
                const comment = `EXCHANGE_TSARS_${userId}`;

                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 360,
                    messages: [
                        {
                            address: MY_WALLET_ADDRESS, 
                            amount: "1000000", // 0.001 TON
                            payload: btoa(comment)
                        }
                    ]
                };

                await tonConnectUI.sendTransaction(transaction);
                
                points -= 50;
                score += 25;
                updateStats();
                alert("Успешно обменяно! +25 Царей добавлено в казну.");

            } catch (error) {
                console.error("Transaction cancelled or failed:", error);
                alert("Обмен отменен или произошла ошибка транзакции.");
            }
        }

        async function buyPointsWithTon() {
            initAudio();
            if (!tonConnectUI.connected) {
                alert("Пожалуйста, подключите кошелек!");
                await tonConnectUI.openModal();
                return;
            }

            try {
                const userId = tg.initDataUnsafe?.user?.id || "unknown";
                const comment = `BUY_POINTS_${userId}`;

                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 360,
                    messages: [
                        {
                            address: MY_WALLET_ADDRESS, 
                            amount: "1000000", // 0.001 TON
                            payload: btoa(comment)
                        }
                    ]
                };

                await tonConnectUI.sendTransaction(transaction);
                
                points += 50;
                gameActive = true;
                document.getElementById('gameover-modal').classList.add('hidden');
                updateStats();
                setupNewRound();
                alert("Успешно! +50 баллов зачислено на ваш счет.");

            } catch (error) {
                console.error("Transaction cancelled or failed:", error);
                alert("Покупка отменена или произошла ошибка транзакции.");
            }
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let now = audioCtx.currentTime;
                if (type === 'spin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 1.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                    osc.start(now);
                    osc.stop(now + 1.2);
                } else if (type === 'diamond') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'empty') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {
                console.log(e);
            }
        }

        window.onload = function() {
            startGame();
        };

        function startGame() {
            initAudio();
            document.getElementById('win-modal').classList.add('hidden');
            document.getElementById('gameover-modal').classList.add('hidden');
            points = 100;
            score = 0;
            diamondsFound = 0;
            updateStats();
            gameActive = true;
            setupNewRound();
        }

        function resetGame() {
            startGame();
        }

        function updateStats() {
            document.getElementById('points').innerText = points;
            document.getElementById('score').innerText = score;
            document.getElementById('diamonds').innerText = diamondsFound;
        }

        function setupNewRound() {
            const container = document.getElementById('barrels-container');
            container.innerHTML = '';
            
            winningBarrelIndex = Math.floor(Math.random() * TOTAL_BARRELS);
            barrelsData = Array.from({length: TOTAL_BARRELS}, (_, i) => (i === winningBarrelIndex));

            for (let i = 0; i < TOTAL_BARRELS; i++) {
                const barrel = document.createElement('div');
                barrel.className = 'barrel';
                barrel.id = 'barrel-' + i;
                barrel.innerHTML = `
                    <div class="barrel-rings ring-top"></div>
                    <div class="barrel-content">?</div>
                    <div class="barrel-rings ring-bottom"></div>
                `;
                container.appendChild(barrel);
            }

            if (points < SPIN_COST_POINTS) {
                triggerGameOver();
                return;
            }

            document.getElementById('spin-btn').disabled = false;
        }

        function spinWheel() {
            if (!gameActive || points < SPIN_COST_POINTS) return;
            
            initAudio();

            points -= SPIN_COST_POINTS;
            updateStats();

            document.getElementById('spin-btn').disabled = true;
            playSound('spin');

            const sectorAngle = 360 / TOTAL_BARRELS;
            const extraSpins = 4 * 360;
            const targetAngle = extraSpins + (winningBarrelIndex * sectorAngle) + (sectorAngle / 2);
            
            currentRotation += targetAngle;
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                revealBarrel(winningBarrelIndex);
            }, 1500);
        }

        function revealBarrel(selectedIdx) {
            const barrelEl = document.getElementById('barrel-' + selectedIdx);
            if (!barrelEl) return;
            barrelEl.classList.add('selected');

            const contentDiv = barrelEl.querySelector('.barrel-content');
            const hasDiamond = barrelsData[selectedIdx];

            setTimeout(() => {
                if (hasDiamond) {
                    contentDiv.innerHTML = '💎';
                    barrelEl.style.background = 'linear-gradient(135deg, #005c8a 0%, #002b3d 100%)';
                    points += WIN_REWARD_POINTS;
                    diamondsFound++;
                    
                    if (Math.random() < 0.5) {
                        score += 5;
                    }

                    playSound('diamond');
                    updateStats();

                    if (diamondsFound >= 10) {
                        triggerWin();
                    }
                } else {
                    contentDiv.innerHTML = '❌';
                    barrelEl.style.background = 'linear-gradient(135deg, #8a0000 0%, #3d0000 100%)';
                    playSound('empty');
                    updateStats();
                }

                setTimeout(() => {
                    if (gameActive && diamondsFound < 10) {
                        setupNewRound();
                    }
                }, 1500);

            }, 400);
        }

        function triggerWin() {
            gameActive = false;
            document.getElementById('win-modal').classList.remove('hidden');
        }

        function triggerGameOver() {
            gameActive = false;
            document.getElementById('gameover-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
