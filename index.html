<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iCryptoCheck Payments & Store</title>
    <!-- Підключаємо Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1f2937;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #60a5fa;
        }
        p {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #111827;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        #result {
            margin-top: 15px;
            font-size: 13px;
            word-break: break-all;
            text-align: left;
            background: #111827;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>iCryptoCheck Оплата</h1>
        <p>Введіть адресу гаманця або суму для перевірки платежу</p>
        
        <input type="text" id="walletInput" placeholder="Введіть адресу гаманця (TON / UA)...">
        <button class="btn" onclick="checkPayment()">Перевірити платіж</button>
        
        <div id="result"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function checkPayment() {
            let wallet = document.getElementById('walletInput').value;
            let resultDiv = document.getElementById('result');
            
            if (!wallet) {
                alert('Будь ласка, введіть дані!');
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Запит виконується...';

            // Примітка: Безпечні запити з використанням вашого токена iCryptoCheck 
            // краще пускати через GitHub Actions / сервер, щоб не світити ключ у браузері,
            // але для тестування міні-додатка структура виглядає так:
            
            setTimeout(() => {
                resultDiv.innerHTML = `<b>Статус:</b> Запит для гаманця ${wallet} оброблено. Система готова до інтеграції з бота.`;
            }, 1000);
        }
    </script>

</body>
</html>
