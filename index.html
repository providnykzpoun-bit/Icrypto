<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iCrypto Оплата та Донати</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1f2937;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 12px;
            color: #93c5fd;
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #111827;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>iCrypto Оплата</h1>
        <p>Оберіть валюту та вкажіть суму внеску</p>
        
        <div class="input-group">
            <label for="currency">Виберіть валюту:</label>
            <select id="currency">
                <option value="TON">TON</option>
                <option value="UA">UA Token</option>
                <option value="USDT">USDT</option>
            </select>
        </div>

        <div class="input-group">
            <label for="amount">Сума:</label>
            <input type="number" id="amount" placeholder="Наприклад: 10">
        </div>

        <div class="input-group">
            <label for="comment">Коментар:</label>
            <input type="text" id="comment" placeholder="Від кого донат...">
        </div>
        
        <button class="btn" onclick="processPayment()">Продовжити оплату</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function processPayment() {
            let currency = document.getElementById('currency').value;
            let amount = document.getElementById('amount').value;
            let comment = document.getElementById('comment').value;
            
            if (!amount || amount <= 0) {
                alert('Будь ласка, вкажіть суму!');
                return;
            }

            // Формуємо перехід у бота з готовими даними (замініть ім'я вашого бота, якщо потрібно)
            let botUrl = `https://t.me/iCryptoCheck_bot?start=pay_${amount}_${currency}`;
            
            // Відкриваємо бота через Telegram Web App або напряму
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                window.open(botUrl, '_blank');
            } else {
                window.location.href = botUrl;
            }
        }
    </script>

</body>
</html>
